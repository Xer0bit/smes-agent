server {
    listen 80;
    server_name 1000.ecomgear.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 1000.ecomgear.dev;

    ssl_certificate     /etc/letsencrypt/live/www.ecomgear.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ecomgear.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/ecomgear/dist;
    index index.html;

    # Redirect bare root to admin login
    location = / {
        return 302 /admin/login;
    }

    # SPA: serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always revalidate — see vps1-ecomgear.dev.conf for why.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
