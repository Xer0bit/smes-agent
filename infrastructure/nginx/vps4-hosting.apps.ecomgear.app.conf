# =============================================================================
# VPS4 — Hosting Node
# Roles: Static Site Hosting + Custom Domain Management (Caddy + hosting-service)
# Domains: apps.ecomgear.app  *.apps.ecomgear.app  (custom domains pass through)
#
# SSL: Caddy manages TLS for custom domains automatically.
#      nginx proxies admin API calls to hosting-service on :4000.
#
# Deploy: sudo cp this file /etc/nginx/sites-available/vps4-hosting.conf
#         sudo ln -sf /etc/nginx/sites-available/vps4-hosting.conf /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream hosting_service {
    server 127.0.0.1:4000;
    keepalive 16;
}

# =============================================================================
# HOSTING API — apps.ecomgear.app
# Fronts the hosting-service (Express on :4000).
# /deploy/:projectId  receives exported build bundles (up to 200 MB).
# /domains/*          receives small JSON payloads.
# =============================================================================
server {
    listen 443 ssl http2;
    server_name apps.ecomgear.app;

    ssl_certificate     /etc/letsencrypt/live/apps.ecomgear.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.ecomgear.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Health check
    location = /health {
        access_log off;
        proxy_pass http://hosting_service/health;
    }

    # Config endpoint (returns publicIp — small payload)
    location = /config {
        proxy_pass         http://hosting_service/config;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 30s;
    }

    # Deploy endpoint — receives exported build bundles (can be large)
    location ~ ^/deploy(/.*)?$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, x-deploy-secret";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length               0;
            add_header Content-Type                 "text/plain";
            return 204;
        }

        client_max_body_size 200M;

        proxy_pass         http://hosting_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Domain management endpoints (verify, activate, list, remove — small payloads)
    location ~ ^/domains(/.*)?$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, x-deploy-secret";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length               0;
            add_header Content-Type                 "text/plain";
            return 204;
        }

        client_max_body_size 1M;

        proxy_pass         http://hosting_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 60s;
    }

    # Catch-all for any other hosting-service endpoints
    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, x-deploy-secret";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length               0;
            add_header Content-Type                 "text/plain";
            return 204;
        }

        client_max_body_size 10M;

        proxy_pass         http://hosting_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }
}

# =============================================================================
# HTTP → HTTPS redirect
# =============================================================================
server {
    listen 80;
    server_name apps.ecomgear.app;
    return 301 https://$host$request_uri;
}
