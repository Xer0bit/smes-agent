# PostgREST rate limiting -- incident mitigation (see docs/incidents or
# repo history for context). Every generated app's anon key is public by
# design, so a single valid request pattern can't be told apart from a
# scraper holding the same key -- this doesn't fix that, it just raises the
# cost of bulk table enumeration/dumping while a real fix (RLS-by-default,
# tenant-schema RLS backfill) is rolled out. 20 req/s per IP with a burst of
# 40 is generous enough for a real app's normal parallel page-load calls;
# sustained scraping past that gets throttled (503 on overflow, no delay).
limit_req_zone $binary_remote_addr zone=postgrest_limit:10m rate=20r/s;
