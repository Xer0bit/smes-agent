# =============================================================================
# VPS1   156.67.218.75 (Singapore)
# Roles: Main Frontend + Supabase Edge
# Domains: ecomgear.dev  www.ecomgear.dev  api.ecomgear.dev
# =============================================================================

upstream supabase_kong {
    server 127.0.0.1:54321;   # Supabase Kong gateway
    keepalive 64;
}

upstream ecomgear_api {
    server 127.0.0.1:5002;    # ecomgear-api PM2 app (server/, SERVICE_ROLE=api)
    keepalive 64;
}

# Shared CORS macro
map $http_origin $cors_origin {
    default                      "";
    "https://ecomgear.dev"       "https://ecomgear.dev";
    "https://www.ecomgear.dev"   "https://www.ecomgear.dev";
    "https://1000.ecomgear.dev"  "https://1000.ecomgear.dev";
    # Live previews are served path-based at the bare preview.ecomgear.app domain
    # (https://preview.ecomgear.app/preview/<projectId>/...), NOT as subdomains  
    # the regex below only ever matched a subdomain shape that nothing actually
    # uses, so $cors_origin silently fell through to "" for every real preview
    # request and every generated app's cross-origin call (edge functions,
    # hosted DB, etc.) failed with "CORS header Access-Control-Allow-Origin
    # missing". Kept the regex too in case subdomain-based previews exist elsewhere.
    "https://preview.ecomgear.app"         "https://preview.ecomgear.app";
    ~^https://.*\.preview\.ecomgear\.app$  $http_origin;
    # Local dev against production Supabase auth/rest/storage/functions (Kong).
    # This map is separate from api-gateway's own CORS_ORIGIN allowlist
    # (server/src/app.ts) -- that one only covers /api/v1/*, this one covers
    # /auth|rest|storage|functions/v1/* proxied straight to supabase_kong.
    "http://localhost:8080"      "http://localhost:8080";
}

# =============================================================================
# apex → www redirect
# =============================================================================
server {
    listen 443 ssl;
    server_name ecomgear.dev;

    ssl_certificate     /etc/letsencrypt/live/www.ecomgear.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ecomgear.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.ecomgear.dev$request_uri;
}

# =============================================================================
# FRONTEND   www.ecomgear.dev
# =============================================================================
server {
    listen 443 ssl;
    server_name www.ecomgear.dev;

    ssl_certificate     /etc/letsencrypt/live/www.ecomgear.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ecomgear.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/ecomgear/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml font/woff2;
    gzip_comp_level 6;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # SPA catch-all
    location / {
        try_files $uri $uri/ /index.html;
        error_page 404 /index.html;
    }

    # Hashed build output. A chunk that no longer exists (tab opened before a
    # deploy) must fail as a 404, not come back as index.html with a text/html
    # MIME type -- the browser then blocks the module and the page dies in an
    # error boundary. With a real 404 the client reloads itself (main.tsx).
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must always revalidate   it references hashed asset filenames,
    # so a stale cached index.html keeps loading a stale JS bundle even after a
    # fresh deploy (users report "fix isn't live" when it actually is).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # Immutable static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

}

# =============================================================================
# SUPABASE EDGE API   api.ecomgear.dev
# Proxies: /auth/ /rest/ /storage/ /realtime/ /functions/ → Supabase Kong :8000
# =============================================================================
server {
    listen 443 ssl;
    server_name api.ecomgear.dev;

    ssl_certificate     /etc/letsencrypt/live/www.ecomgear.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ecomgear.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Realtime WebSocket ───────────────────────────────────────────────────
    location /realtime/ {
        proxy_pass         http://supabase_kong/realtime/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true"       always;
    }

    # ── OPTIONS preflight macro ──────────────────────────────────────────────
    location @cors_preflight {
        add_header Access-Control-Allow-Origin      $cors_origin;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, apikey, x-client-info, x-supabase-api-version, x-api-version, x-operation-id, idempotency-key, x-idempotency-key, x-external-authorization, accept-profile, content-profile, x-upsert, cache-control, prefer, range";
        add_header Access-Control-Allow-Credentials "true";
        add_header Access-Control-Max-Age           86400;
        add_header Content-Length                   0;
        add_header Content-Type                     "text/plain";
        return 204;
    }

    # ── ecomgear-api (Node/Express, everything except LLM generation) ────────
    # ^~ gives this prefix priority over the regex Supabase location below  
    # /api/v1/* never collides with /auth|/rest|/storage|/functions anyway,
    # but ^~ keeps that true even if new Supabase-proxied prefixes are added later.
    location ^~ /api/v1/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            # Kept in sync by hand with server/src/app.ts's cors() allowedHeaders   nginx
            # answers this preflight directly and never reaches Express, so a header added
            # there without being added here silently breaks that header in production only.
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, apikey, x-client-info, x-api-version, x-operation-id, idempotency-key, x-idempotency-key, x-upsert, cache-control, prefer, range, x-requested-with, last-event-id, x-update-secret, x-project-id, x-service-key, x-dashboard-access";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age           86400;
            add_header Content-Length                   0;
            add_header Content-Type                     "text/plain";
            return 204;
        }

        client_max_body_size 50M;

        proxy_pass         http://ecomgear_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # ── ecomgear-api health check ────────────────────────────────────────────
    location = /health {
        proxy_pass http://ecomgear_api;
    }

    # ── GitHub OAuth callback (ecomgear-api) ─────────────────────────────────
    # ^~ gives this prefix priority over the /auth|rest|storage|functions/
    # regex below   GitHub's registered "Authorization callback URL" is
    # /auth/github/callback, which must reach Express, not Supabase Kong.
    location ^~ /auth/github/ {
        client_max_body_size 50M;

        proxy_pass         http://ecomgear_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # ── Google Analytics OAuth callback (ecomgear-api) ───────────────────────
    # Same reasoning as /auth/github/ above: Google's registered "Authorized
    # redirect URI" is /auth/google-analytics/callback, which must reach
    # Express, not Supabase Kong (the /auth|rest|storage|functions/ regex
    # below would otherwise swallow it   confirmed live, this route 404'd
    # before this block existed).
    location ^~ /auth/google-analytics/ {
        client_max_body_size 50M;

        proxy_pass         http://ecomgear_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # ── Supabase routes ──────────────────────────────────────────────────────
    location ~ ^/(auth|rest|storage|functions)/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, apikey, x-client-info, x-supabase-api-version, x-api-version, x-operation-id, idempotency-key, x-idempotency-key, x-external-authorization, accept-profile, content-profile, x-upsert, cache-control, prefer, range";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age           86400;
            add_header Content-Length                   0;
            add_header Content-Type                     "text/plain";
            return 204;
        }

        client_max_body_size 50M;

        proxy_pass         http://supabase_kong;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 300s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, apikey, x-client-info, x-supabase-api-version, x-api-version, x-operation-id, idempotency-key, x-idempotency-key, x-external-authorization, accept-profile, content-profile, x-upsert, cache-control, prefer, range, x-dashboard-access, x-project-id" always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # ── Catch-all → Kong ─────────────────────────────────────────────────────
    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, apikey, x-client-info, x-supabase-api-version, x-api-version, x-operation-id, idempotency-key, x-idempotency-key, x-external-authorization";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age           86400;
            add_header Content-Length                   0;
            add_header Content-Type                     "text/plain";
            return 204;
        }

        proxy_pass         http://supabase_kong;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 300s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true"       always;
    }
}

# =============================================================================
# HTTP → HTTPS redirects
# =============================================================================
server {
    listen 80;
    server_name ecomgear.dev www.ecomgear.dev api.ecomgear.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://www.ecomgear.dev$request_uri;
}
