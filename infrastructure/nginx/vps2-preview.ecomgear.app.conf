# =============================================================================
# VPS2   72.62.126.99 (Indonesia)
# Roles: Preview Hosting + Generated Apps
# Domains: preview.ecomgear.app  *.preview.ecomgear.app
#
# SSL: Wildcard cert required   obtain with:
#   certbot certonly --dns-<provider> -d preview.ecomgear.app -d *.preview.ecomgear.app
# =============================================================================

upstream preview_service {
    server 127.0.0.1:3001;
    keepalive 32;
}

# =============================================================================
# WILDCARD PREVIEW   *.preview.ecomgear.app
# Each generated project served as: {projectId}.preview.ecomgear.app
# =============================================================================
server {
    listen 443 ssl http2;
    server_name *.preview.ecomgear.app;

    ssl_certificate     /etc/letsencrypt/live/preview.ecomgear.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.ecomgear.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Extract projectId from subdomain (e.g. abc123.preview.ecomgear.app → abc123)
    set $project_id $host;
    if ($host ~* ^([^.]+)\.preview\.ecomgear\.app$) {
        set $project_id $1;
    }

    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, apikey, x-api-version, x-operation-id, x-client-info, x-external-authorization";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length               0;
            add_header Content-Type                 "text/plain";
            return 204;
        }

        proxy_pass         http://preview_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Project-ID      $project_id;

        # WebSocket / Vite HMR
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
        proxy_connect_timeout 60;

        proxy_buffering off;
        proxy_cache     off;
    }
}

# =============================================================================
# ROOT PREVIEW HOST   preview.ecomgear.app
# Routes /preview/{projectId}/* to the preview service
# =============================================================================
server {
    listen 443 ssl http2;
    server_name preview.ecomgear.app;

    ssl_certificate     /etc/letsencrypt/live/preview.ecomgear.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.ecomgear.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Health check
    location = /health {
        access_log off;
        proxy_pass http://preview_service/health;
    }

    # VPN-only editor route (code-server on localhost:8443)
    location = /editor {
        return 301 /editor/;
    }

    location ^~ /editor/ {
        allow 127.0.0.1;
        allow 100.64.0.0/10;
        deny all;

        proxy_pass         http://127.0.0.1:8443/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering    off;
    }

    # Publish and slug lookup endpoints used by the frontend.
    location ~ ^/(check-subdomain|publish)(/.*)?$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, apikey, x-api-version, x-operation-id, x-client-info, x-external-authorization";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length               0;
            add_header Content-Type                 "text/plain";
            return 204;
        }

        client_max_body_size 200M;

        proxy_pass         http://preview_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    # Published site route: /p/{slug}
    location ~ ^/p(/.*)?$ {
        proxy_pass         http://preview_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
        proxy_connect_timeout 60;

        proxy_buffering off;
        proxy_cache     off;
    }

    # Preview file update endpoint (called by agent on VPS3), plus package
    # install/list and runtime control -- all root-level utility routes
    # server.js exposes outside /preview/*. packages/control were missing
    # here entirely (found 2026-08-15): requests fell through to the
    # location / catch-all below and got redirected to /preview/ (404),
    # so run_command's fire-and-forget sync-to-preview install call
    # (run_command.ts's syncPackagesToPreviewService) silently failed for
    # every project on every non-preinstalled package -- the agent's local
    # install succeeded, so it reported success, but the live preview's
    # actual node_modules never received the package.
    location ~ ^/(update-files|create-project|delete-project|packages|control) {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, apikey, x-api-version, x-operation-id, x-client-info, x-external-authorization";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length               0;
            add_header Content-Type                 "text/plain";
            return 204;
        }

        client_max_body_size 10M;

        proxy_pass         http://preview_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    # Preview app route
    # OPTIONS is intentionally NOT short-circuited here (unlike the other
    # locations in this file) — credentialed endpoints like /session and
    # /renew need the real per-origin + Access-Control-Allow-Credentials
    # response that preview-service/server.js's cors(corsOptions) produces;
    # a hardcoded "*" here breaks the browser's credentialed preflight check.
    location ~ ^/preview(/.*)?$ {
        client_max_body_size 50M;

        proxy_pass         http://preview_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
        proxy_connect_timeout 60;

        proxy_buffering off;
        proxy_cache     off;
    }

    # Root-level asset paths (generated code using an absolute
    # `/assets/image.png` instead of `${import.meta.env.BASE_URL}assets/...`)
    # were falling through to the location / catch-all below and getting
    # redirected to a bare /preview/ instead of reaching server.js's own
    # asset-rescue middleware, which resolves these via the Referer header --
    # that middleware has never actually run in production because nginx
    # swallowed the request first. Same root cause as the 2026-08-15
    # update-files/packages/control incident documented above, for a
    # different route set. Confirmed live 2026-08-19, project dfe41091.
    location ~ ^/(assets|images|fonts|icons|media)/ {
        proxy_pass         http://preview_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
    }

    location / {
        return 301 /preview/;
    }
}

# =============================================================================
# HTTP → HTTPS redirects
# =============================================================================
server {
    listen 80;
    server_name preview.ecomgear.app *.preview.ecomgear.app;
    return 301 https://$host$request_uri;
}

# No catch-all "_" block here   sites-available/catch-all-domains.conf already
# owns `listen 80 default_server` on this host (for misconfigured custom-domain
# CNAMEs). A second default_server on the same listen address is a duplicate
# nginx refuses to load; this file used to ship one and it silently broke
# `nginx -t` on every deploy from 2026-07-16 onward once catch-all-domains.conf
# was added, without ever failing the deploy script outright.
