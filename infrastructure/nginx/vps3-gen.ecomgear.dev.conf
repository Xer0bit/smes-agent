    # per-event arrival times through nginx with gzip off vs on, upstream
    # emitting one event per second:
    #   gzip off: +1.02 +2.02 +3.02 +4.02 +5.02   42215 bytes
    #   gzip on : +1.02 +2.02 +3.02 +4.02 +5.02     511 bytes
    # Identical arrival times, so proxy_buffering off is enough to keep each
