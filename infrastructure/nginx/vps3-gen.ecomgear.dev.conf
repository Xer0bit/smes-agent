# =============================================================================
# HTTP → HTTPS redirects
# =============================================================================
server {
    listen 80;
    server_name gen.ecomgear.dev agent.ecomgear.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://gen.ecomgear.dev$request_uri;
}
