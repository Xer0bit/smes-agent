# =============================================================================
# HTTP → HTTPS redirects
# =============================================================================
server {
    listen 80;
    server_name gen.SMEsAgent.dev agent.SMEsAgent.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://gen.SMEsAgent.dev$request_uri;
}
