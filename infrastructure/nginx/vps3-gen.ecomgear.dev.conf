# =============================================================================
# VPS3   3.148.126.20 (United States)
# Roles: LLM / Code Generation API + Agent Runner
# Domains: gen.SMEsAgent.dev  agent.SMEsAgent.dev
# =============================================================================

upstream gen_api {
    server 127.0.0.1:5001;   # Code-gen / LLM backend (Node.js / Express)
    keepalive 64;
}

upstream agent_runner {
    server 127.0.0.1:5001;   # Unified gen/agent service
    keepalive 32;
}

upstream preview_bridge {
    # Preview service on VPS2   used for internal file-push calls
    server 72.62.126.99:3001;
    keepalive 8;
}

map $http_origin $frontend_cors_origin {
    default                     "";
    "https://SMEsAgent.dev"     "https://SMEsAgent.dev";
    "https://www.SMEsAgent.dev" "https://www.SMEsAgent.dev";
    "http://localhost:8080"    "http://localhost:8080";
    "http://localhost:5173"    "http://localhost:5173";
    "http://localhost:3000"    "http://localhost:3000";
    "http://127.0.0.1:5173"   "http://127.0.0.1:5173";
    "http://127.0.0.1:3000"   "http://127.0.0.1:3000";
    # Generated/published eCG dashboards live on these domains and call back
    # here for /api/v1/ecg-access, ecg-proxy, ecg-chat. Mirrors the Express
    # CORS allowlist in server/src/app.ts (*.SMEsAgent.app / *.SMEsAgent.dev).
    "~^https://([a-z0-9-]+\.)*SMEsAgent\.app$" $http_origin;
    "~^https://([a-z0-9-]+\.)*SMEsAgent\.dev$" $http_origin;
}

# =============================================================================
# CODE GENERATION API   gen.SMEsAgent.dev
# =============================================================================
server {
    listen 443 ssl http2;
    server_name gen.SMEsAgent.dev;

    ssl_certificate     /etc/letsencrypt/live/gen.SMEsAgent.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gen.SMEsAgent.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Compress the agent SSE stream ─────────────────────────────────────
    # The agent-stream response is the largest thing this host sends: a run on
    # a 194-file project streams ~1.7MB of source across tool-output and done
    # events, and it was going out uncompressed. Measured on this box
    # 2026-08-25: 1.70MB -> 0.46MB for that project's real text.
    #
    # gzip on an SSE stream risks buffering events until the compressor fills,
    # which would make the run look frozen -- worse than slow, and worst on the
    # connections this is meant to help. Probed here before enabling, comparing
    # per-event arrival times through nginx with gzip off vs on, upstream
    # emitting one event per second:
    #   gzip off: +1.02 +2.02 +3.02 +4.02 +5.02   42215 bytes
    #   gzip on : +1.02 +2.02 +3.02 +4.02 +5.02     511 bytes
    # Identical arrival times, so proxy_buffering off is enough to keep each
    # event flushing. Note the upstream sends `Cache-Control: no-transform`
    # (ai.routes.ts) and nginx compresses anyway -- it does not honour that
    # header, which is why this works without touching the route.
    gzip              on;
    gzip_proxied      any;
    gzip_types        text/event-stream application/json text/plain;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_vary         on;

    # Health
    location = /health {
        access_log off;
        proxy_pass http://gen_api/health;
    }

    # VPN-only editor route (code-server on localhost:8443)
    location = /editor {
        return 301 /editor/;
    }

    location ^~ /editor/ {
        allow 127.0.0.1;
        allow 100.64.0.0/10;
        deny all;

        proxy_pass         http://127.0.0.1:8443/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering    off;
    }

    # SSE streaming (code-gen progress events)
    location ~ ^/(generate|stream|codegen) {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin      $frontend_cors_origin;
            add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, Cache-Control, apikey, x-api-version, x-operation-id, idempotency-key, x-idempotency-key, x-client-info, x-upsert, prefer, range, x-dashboard-access, x-project-id";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age           86400;
            add_header Content-Length                   0;
            add_header Content-Type                     "text/plain";
            return 204;
        }

        proxy_pass         http://gen_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # SSE: disable buffering
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;   # 10 min max for LLM streams
        proxy_send_timeout 600s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin      $frontend_cors_origin always;
        add_header Access-Control-Allow-Credentials "true"             always;
        add_header X-Accel-Buffering "no" always;
    }

    # All other API routes
    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin      $frontend_cors_origin;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, Cache-Control, apikey, x-api-version, x-operation-id, idempotency-key, x-idempotency-key, x-client-info, x-upsert, prefer, range, x-dashboard-access, x-project-id";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age           86400;
            add_header Content-Length                   0;
            add_header Content-Type                     "text/plain";
            return 204;
        }

        client_max_body_size 10M;

        proxy_pass         http://gen_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 300s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin      $frontend_cors_origin always;
        add_header Access-Control-Allow-Credentials "true"             always;

    }
}

# =============================================================================
# AGENT RUNNER   agent.SMEsAgent.dev
# =============================================================================
server {
    listen 443 ssl http2;
    server_name agent.SMEsAgent.dev;

    ssl_certificate     /etc/letsencrypt/live/gen.SMEsAgent.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gen.SMEsAgent.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Compress the agent SSE stream ─────────────────────────────────────
    # The agent-stream response is the largest thing this host sends: a run on
    # a 194-file project streams ~1.7MB of source across tool-output and done
    # events, and it was going out uncompressed. Measured on this box
    # 2026-08-25: 1.70MB -> 0.46MB for that project's real text.
    #
    # gzip on an SSE stream risks buffering events until the compressor fills,
    # which would make the run look frozen -- worse than slow, and worst on the
