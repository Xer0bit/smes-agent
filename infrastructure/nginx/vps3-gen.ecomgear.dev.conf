            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, Cache-Control, apikey, x-api-version, x-operation-id, idempotency-key, x-idempotency-key, x-client-info, x-upsert, prefer, range, x-dashboard-access, x-project-id";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age           86400;
            add_header Content-Length                   0;
            add_header Content-Type                     "text/plain";
            return 204;
        }

        client_max_body_size 10M;

        proxy_pass         http://agent_runner;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
