# =============================================================================
# VPS5 — 187.127.108.19
# Role: Tenant Postgres (paid-user hosted databases, one schema per project)
# Domains: db.SMEsAgent.app (legacy/original), cloud.SMEsAgent.app (canonical
#          going forward — see TENANT_DB_API_URL). Both serve the same
#          PostgREST instance (127.0.0.1:3000, ecg-tenants).
#
# This is a snapshot of the live /etc/nginx/sites-enabled/ecg-db-new on
# VPS5, kept here for reference — VPS5 is NOT auto-deployed to by CI/CD
# (see scripts/deploy.sh's deploy_vps5, which only health-checks).
# Last synced with live: 2026-08-08 (added limit_req rate-limiting on every
# PostgREST-proxying location — incident mitigation for unauthenticated
# tenant-table read exposure via the public anon key; see
# /etc/nginx/conf.d/postgrest-rate-limit.conf on VPS5 for the zone
# definition, mirrored at infrastructure/nginx/vps5-postgrest-rate-limit.conf
# in this repo. Temporary mitigation, not the real fix — see
# database.service.ts's enableRlsOnNewTables() and the pending RLS backfill
# for existing tables).
# =============================================================================

# Redirect bare HTTP to HTTPS (Cloudflare handles the outer HTTPS)
server {
    if ($host = db.SMEsAgent.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name db.SMEsAgent.app;
    return 301 https://$host$request_uri;


}

# HTTPS — Cloudflare terminates SSL at edge, connects here with Full mode
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name db.SMEsAgent.app;
    ssl_certificate /etc/letsencrypt/live/db.SMEsAgent.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/db.SMEsAgent.app/privkey.pem; # managed by Certbot
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Only accept traffic from Cloudflare IPs (security hardening)
    # Full list: https://www.cloudflare.com/ips/

    # Tenant-scoped path routing: /tenant_xxxxxxxxxxxxxxxx/rest/v1/<table>
    # Derives Accept-Profile/Content-Profile from the URL path itself instead
    # of trusting a client-supplied header — eliminates the "forgot the
    # header, silently routed to the wrong/default schema" class of bug
    # (406/404s seen in generated apps). VITE_DB_API_URL already includes the
    # tenant_xxxx segment, so client code never needs to know the schema.
    location ~ "^/(tenant_[0-9a-f]{16})/rest/v1/(.*)$" {
        proxy_pass         http://127.0.0.1:3000/$2$is_args$args;
        limit_req          zone=postgrest_limit burst=40 nodelay;
        proxy_set_header   Accept-Profile $1;
        proxy_set_header   Content-Profile $1;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Accept-Profile, Content-Profile, Prefer, Range, apikey, x-client-info, x-supabase-api-version" always;
        add_header Access-Control-Expose-Headers "Content-Range, Range" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # Tenant-scoped edge-function invocation: /tenant_xxxxxxxxxxxxxxxx/functions/<name>/invoke
    # Proxies to the local functions-runner service (vps5-functions-runner/),
    # which independently verifies the tenant anon/service JWT before doing
    # anything — nginx here is just a path-based router, same pattern as the
    # rest/v1 block above.
    location ~ "^/(tenant_[0-9a-f]{16})/functions/(.*)$" {
        proxy_pass         http://127.0.0.1:4001/$1/functions/$2$is_args$args;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, apikey, x-client-info" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # Supabase-style path compatibility: generated apps and supabase-js call
    # /rest/v1/<table>, but PostgREST only understands /<table> — strip the
    # prefix (trailing slash on proxy_pass replaces the matched /rest/v1/).
    # Kept for older projects still using the bare-host + Accept-Profile-header
    # convention (VITE_DB_API_URL without a tenant_xxxx path segment).
    location /rest/v1/ {
        proxy_pass         http://127.0.0.1:3000/;
        limit_req          zone=postgrest_limit burst=40 nodelay;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Accept-Profile, Content-Profile, Prefer, Range, apikey, x-client-info, x-supabase-api-version" always;
        add_header Access-Control-Expose-Headers "Content-Range, Range" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        limit_req          zone=postgrest_limit burst=40 nodelay;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        # CORS — SMEsAgent.dev and localhost dev
        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Accept-Profile, Content-Profile, Prefer, Range, apikey, x-client-info, x-supabase-api-version" always;
        add_header Access-Control-Expose-Headers "Content-Range, Range" always;
        if ($request_method = OPTIONS) { return 204; }
    }

}

