# =============================================================================
# VPS5 — 187.127.108.19
# Role: Tenant Postgres (paid-user hosted databases, one schema per project)
# Domains: db.ecomgear.app (legacy/original), cloud.ecomgear.app (canonical
#          going forward — see TENANT_DB_API_URL). Both serve the same
#          PostgREST instance (127.0.0.1:3000, ecg-tenants) so existing
#          published apps referencing db.ecomgear.app keep working.
#
# This is a snapshot of the live /etc/nginx/sites-available/ecg-db-new on
# VPS5, kept here for reference — VPS5 is NOT auto-deployed to by CI/CD
# (see scripts/deploy.sh's deploy_vps5, which only health-checks). Cloudflare
# terminates the outer TLS in Full mode; nginx here does its own cert too.
# =============================================================================

server {
    if ($host = db.ecomgear.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name db.ecomgear.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name db.ecomgear.app;
    ssl_certificate /etc/letsencrypt/live/db.ecomgear.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/db.ecomgear.app/privkey.pem; # managed by Certbot
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Accept-Profile, Content-Profile, Prefer, Range, apikey" always;
        add_header Access-Control-Expose-Headers "Content-Range, Range" always;
        if ($request_method = OPTIONS) { return 204; }
    }
}

# ── cloud.ecomgear.app — new canonical domain (added alongside db.ecomgear.app) ──
