# =============================================================================
# VPS5   187.127.108.19
# Role: Tenant Postgres (paid-user hosted databases, one schema per project)
# Domains: db.ecomgear.app (legacy/original), cloud.ecomgear.app (canonical
#          going forward   see TENANT_DB_API_URL). Both serve the same
#          PostgREST instance (127.0.0.1:3000, ecg-tenants).
#
# This is a snapshot of the live /etc/nginx/sites-enabled/ecg-db-new on
# VPS5, kept here for reference   VPS5 is NOT auto-deployed to by CI/CD
# (see scripts/deploy.sh's deploy_vps5, which only health-checks).
# Last synced with live: 2026-07-10 (added /rest/v1/ prefix-strip so
# Supabase-style clients work against raw PostgREST   fixed PGRST125).
# =============================================================================

# Redirect bare HTTP to HTTPS (Cloudflare handles the outer HTTPS)
server {
    if ($host = db.ecomgear.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name db.ecomgear.app;
    return 301 https://$host$request_uri;


}

# HTTPS   Cloudflare terminates SSL at edge, connects here with Full mode
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name db.ecomgear.app;
    ssl_certificate /etc/letsencrypt/live/db.ecomgear.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/db.ecomgear.app/privkey.pem; # managed by Certbot
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Only accept traffic from Cloudflare IPs (security hardening)
    # Full list: https://www.cloudflare.com/ips/

    # Tenant-scoped path routing: /tenant_xxxxxxxxxxxxxxxx/rest/v1/<table>
    # Derives Accept-Profile/Content-Profile from the URL path itself instead
    # of trusting a client-supplied header   eliminates the "forgot the
    # header, silently routed to the wrong/default schema" class of bug
    # (406/404s seen in generated apps). VITE_DB_API_URL already includes the
    # tenant_xxxx segment, so client code never needs to know the schema.
    location ~ "^/(tenant_[0-9a-f]{16})/rest/v1/(.*)$" {
        proxy_pass         http://127.0.0.1:3000/$2$is_args$args;
        proxy_set_header   Accept-Profile $1;
        proxy_set_header   Content-Profile $1;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Accept-Profile, Content-Profile, Prefer, Range, apikey, x-client-info, x-supabase-api-version" always;
        add_header Access-Control-Expose-Headers "Content-Range, Range" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # Supabase-style path compatibility: generated apps and supabase-js call
    # /rest/v1/<table>, but PostgREST only understands /<table>   strip the
    # prefix (trailing slash on proxy_pass replaces the matched /rest/v1/).
    # Kept for older projects still using the bare-host + Accept-Profile-header
    # convention (VITE_DB_API_URL without a tenant_xxxx path segment).
    location /rest/v1/ {
        proxy_pass         http://127.0.0.1:3000/;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Accept-Profile, Content-Profile, Prefer, Range, apikey, x-client-info, x-supabase-api-version" always;
        add_header Access-Control-Expose-Headers "Content-Range, Range" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_hide_header  Access-Control-Allow-Origin;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        # CORS   ecomgear.dev and localhost dev
        add_header Access-Control-Allow-Origin  "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Accept-Profile, Content-Profile, Prefer, Range, apikey, x-client-info, x-supabase-api-version" always;
        add_header Access-Control-Expose-Headers "Content-Range, Range" always;
        if ($request_method = OPTIONS) { return 204; }
    }

}

