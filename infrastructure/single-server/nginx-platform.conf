# =============================================================================
# Single-server platform routing (internal, plain HTTP, 127.0.0.1:8081)
#
# Replaces the per-VPS vhosts in infrastructure/nginx/vps{1,2,3,5}-*.conf with
# one file, all server_name-differentiated on the same loopback port. Caddy
# (see ../single-server/Caddyfile) is the public TLS edge on 80/443 and
# reverse_proxies every platform hostname here — it already forwards the
# original Host header unchanged, so server_name matching below works exactly
# like it did when each of these was its own internet-facing vhost.
#
# Not merged here: VPS4's dynamic/arbitrary custom tenant domains
# (app-smes.xer0bit.com site-per-tenant blocks, imported from
# /etc/caddy/sites/*.caddy). Those are written and reloaded by
# apps/hosting-service itself and stay directly in Caddy — see its own
# Caddyfile fragment, imported as-is by ../single-server/Caddyfile.
#
# Domains are hardcoded (matches the existing per-VPS confs' convention,
# not templated) — canonical values pulled from .env.production
# (VITE_*_URL). Update via sed if the domain ever changes:
#   sed -i 's/smes\.xer0bit\.com/newdomain.com/g' nginx-platform.conf
# =============================================================================

upstream app_api {
    # SERVICE_ROLE=all (single-server default, see apps/api-gateway/src/app.ts)
    # mounts every route group in one process — api.*, gen.* and agent.* all
    # point at the same upstream now, where the 3-VPS split used separate
    # SMEsAgent-api (5002) / SMEsAgent-gen (5001) processes on separate boxes.
    server 127.0.0.1:5001 max_fails=1 fail_timeout=1s;
    server 127.0.0.1:5001 max_fails=1 fail_timeout=1s backup;
    keepalive 64;
}

upstream supabase_kong {
    server 127.0.0.1:54321;   # self-hosted Supabase Kong gateway (prerequisite, not deployed by this repo)
    keepalive 64;
}

upstream preview_service {
    server 127.0.0.1:3001 max_fails=1 fail_timeout=1s;
    server 127.0.0.1:3001 max_fails=1 fail_timeout=1s backup;
    keepalive 32;
}

upstream hosting_service {
    server 127.0.0.1:4000;
    keepalive 16;
}

upstream tenant_postgrest {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream tenant_functions {
    server 127.0.0.1:4001;
    keepalive 16;
}

# PostgREST rate limiting — incident mitigation, unchanged from
# infrastructure/nginx/vps5-postgrest-rate-limit.conf. Every generated app's
# anon key is public by design, so this raises the cost of bulk table
# enumeration/dumping while RLS-by-default rolls out tenant-schema-wide.
limit_req_zone $binary_remote_addr zone=postgrest_limit:10m rate=20r/s;

map $http_origin $cors_origin {
    default                    "";
    "https://smes.xer0bit.com"     "https://smes.xer0bit.com";
    "https://preview.gen-smes.xer0bit.com"         "https://preview.gen-smes.xer0bit.com";
    ~^https://.*\.preview\.gen-smes\.xer0bit\.com$  $http_origin;
    ~^https://([a-z0-9-]+\.)*app-smes\.xer0bit\.com$ $http_origin;
    ~^https://([a-z0-9-]+\.)*smes\.xer0bit\.com$ $http_origin;
    "http://localhost:8080"    "http://localhost:8080";
    "http://localhost:5173"    "http://localhost:5173";
    "http://localhost:3000"    "http://localhost:3000";
}

# =============================================================================
# FRONTEND   smes.xer0bit.com
# =============================================================================
server {
    listen 8081;
    server_name smes.xer0bit.com;

    root  /var/www/ecomgear/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml font/woff2;
    gzip_comp_level 6;

    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
        error_page 404 /index.html;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# =============================================================================
# SUPABASE EDGE + API   api-smes.xer0bit.com
# =============================================================================
server {
    listen 8081;
    server_name api-smes.xer0bit.com;

    location /realtime/ {
        proxy_pass         http://supabase_kong/realtime/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true"       always;
    }

    location ^~ /api/v1/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, apikey, x-client-info, x-api-version, x-operation-id, idempotency-key, x-idempotency-key, x-upsert, cache-control, prefer, range, x-requested-with, last-event-id, x-update-secret, x-project-id, x-service-key, x-dashboard-access";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age           86400;
            add_header Content-Length                   0;
            add_header Content-Type                     "text/plain";
            return 204;
        }

        client_max_body_size 50M;

        proxy_pass         http://app_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    location = /health {
        proxy_pass http://app_api;
    }

    location ^~ /auth/github/ {
        client_max_body_size 50M;
        proxy_pass         http://app_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    location ^~ /auth/google-analytics/ {
        client_max_body_size 50M;
        proxy_pass         http://app_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    location ~ ^/(auth|rest|storage|functions)/ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, apikey, x-client-info, x-supabase-api-version, x-api-version, x-operation-id, idempotency-key, x-idempotency-key, x-external-authorization, accept-profile, content-profile, x-upsert, cache-control, prefer, range";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age           86400;
            add_header Content-Length                   0;
            add_header Content-Type                     "text/plain";
            return 204;
        }

        client_max_body_size 50M;

        proxy_pass         http://supabase_kong;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 300s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, apikey, x-client-info, x-supabase-api-version, x-api-version, x-operation-id, idempotency-key, x-idempotency-key, x-external-authorization, accept-profile, content-profile, x-upsert, cache-control, prefer, range, x-dashboard-access, x-project-id" always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, apikey, x-client-info, x-supabase-api-version, x-api-version, x-operation-id, idempotency-key, x-idempotency-key, x-external-authorization";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age           86400;
            add_header Content-Length                   0;
            add_header Content-Type                     "text/plain";
            return 204;
        }

        proxy_pass         http://supabase_kong;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 300s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true"       always;
    }
}

# =============================================================================
# CODE GENERATION + AGENT   gen-smes.xer0bit.com
# Same app_api upstream as api-smes.xer0bit.com (SERVICE_ROLE=all merges them) —
# kept as separate server_name blocks only because generated frontends and
# existing client config still call these hostnames directly.
# =============================================================================
server {
    listen 8081;
    server_name gen-smes.xer0bit.com;

    # Compress the SSE stream — see infrastructure/nginx/vps3-*.conf for the
    # measured gzip-vs-buffering tradeoff this mirrors verbatim.
    gzip              on;
    gzip_proxied      any;
    gzip_types        text/event-stream application/json text/plain;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_vary         on;

    location = /health {
        access_log off;
        proxy_pass http://app_api/health;
    }

    location ~ ^/(generate|stream|codegen|run|agent|invoke) {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Methods     "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, Cache-Control, apikey, x-api-version, x-operation-id, idempotency-key, x-idempotency-key, x-client-info, x-upsert, prefer, range, x-dashboard-access, x-project-id";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age           86400;
            add_header Content-Length                   0;
            add_header Content-Type                     "text/plain";
            return 204;
        }

        proxy_pass         http://app_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true"      always;
        add_header X-Accel-Buffering "no" always;
    }

    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, Cache-Control, apikey, x-api-version, x-operation-id, idempotency-key, x-idempotency-key, x-client-info, x-upsert, prefer, range, x-dashboard-access, x-project-id";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age           86400;
            add_header Content-Length                   0;
            add_header Content-Type                     "text/plain";
            return 204;
        }

        client_max_body_size 10M;

        proxy_pass         http://app_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 300s;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true"      always;
    }
}

# =============================================================================
# PREVIEW   preview.gen-smes.xer0bit.com, *.preview.gen-smes.xer0bit.com
# =============================================================================
server {
    listen 8081;
    server_name preview.gen-smes.xer0bit.com *.preview.gen-smes.xer0bit.com;

    proxy_next_upstream       error timeout http_502 http_504;
    proxy_next_upstream_tries 2;

    set $project_id $host;
    if ($host ~* ^([^.]+)\.preview\.gen-smes\.xer0bit\.com$) {
        set $project_id $1;
    }

    location = /health {
        access_log off;
        proxy_pass http://preview_service/health;
    }

    location = /editor {
        return 301 /editor/;
    }

    location ^~ /editor/ {
        allow 127.0.0.1;
        deny all;

        proxy_pass         http://127.0.0.1:8443/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering    off;
    }

    location ~ ^/(check-subdomain|publish)(/.*)?$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, apikey, x-api-version, x-operation-id, x-client-info, x-external-authorization";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length               0;
            add_header Content-Type                 "text/plain";
            return 204;
        }

        client_max_body_size 200M;

        proxy_pass         http://preview_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    location ~ ^/p(/.*)?$ {
        proxy_pass         http://preview_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
        proxy_connect_timeout 60;
        proxy_buffering off;
        proxy_cache     off;
    }

    location ~ ^/(update-files|create-project|delete-project|packages|control) {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, apikey, x-api-version, x-operation-id, x-client-info, x-external-authorization";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length               0;
            add_header Content-Type                 "text/plain";
            return 204;
        }

        client_max_body_size 10M;

        proxy_pass         http://preview_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    location ~ ^/preview(/.*)?$ {
        client_max_body_size 50M;

        proxy_pass         http://preview_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
        proxy_connect_timeout 60;
        proxy_buffering off;
        proxy_cache     off;
    }

    location ~ ^/(assets|images|fonts|icons|media)/ {
        proxy_pass         http://preview_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
    }

    location / {
        return 301 /preview/;
    }
}

# =============================================================================
# HOSTING MANAGEMENT API   hosting.app-smes.xer0bit.com, app-smes.xer0bit.com
# Admin/deploy API only — the per-tenant static/app domains themselves are
# served directly by Caddy (see ../single-server/Caddyfile), not through here.
# =============================================================================
server {
    listen 8081;
    server_name hosting.app-smes.xer0bit.com app-smes.xer0bit.com;

    location = /health {
        access_log off;
        proxy_pass http://hosting_service/health;
    }

    location = /config {
        proxy_pass         http://hosting_service/config;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering    off;
        proxy_read_timeout 30s;
    }

    location ~ ^/deploy(/.*)?$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, x-deploy-secret";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length               0;
            add_header Content-Type                 "text/plain";
            return 204;
        }

        client_max_body_size 200M;

        proxy_pass         http://hosting_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/domains(/.*)?$ {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, x-deploy-secret";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length               0;
            add_header Content-Type                 "text/plain";
            return 204;
        }

        client_max_body_size 1M;

        proxy_pass         http://hosting_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 60s;
    }

    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, x-deploy-secret";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length               0;
            add_header Content-Type                 "text/plain";
            return 204;
        }

        client_max_body_size 10M;

        proxy_pass         http://hosting_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }
}

