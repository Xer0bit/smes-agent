version: '3.8'

services:
  preview-service:
    build: ./preview-service
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3001:3001"
      - "24679:24679"
    volumes:
      - ./preview-data:/app/projects
    environment:
      - NODE_ENV=development
      # In dev, ALLOWED_ORIGINS is not set so all origins are allowed (corsOptions falls through)
