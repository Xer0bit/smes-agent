      responses:
        '200': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgeBase' } } } }

  /knowledge-bases/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
