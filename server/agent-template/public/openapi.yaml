openapi: 3.1.0
info:
  title: eCG Agent Dashboard API
  version: "1.0.0"
  description: |
    This is the API your generated dashboard talks to. Every call goes through
    `ecgApi` (see `src/lib/ecgClient.ts`) — never raw `fetch` — and every route
    below is bridged server-side to a real eCG Agent MCP tool call. You never
    need an MCP client library, a session handshake, or the raw MCP tool names:
    this REST surface *is* the MCP surface, translated into ordinary HTTP.

    ## Two connection modes
    Every dashboard is connected one of two ways, and that decides which
    endpoints actually work:

    - **MCP key** (the current, default way to connect — paste an `ecg_...`
      key from `app.ecomgear.ai/org/api-keys`): every endpoint tagged **MCP**
      below works. Endpoints tagged **Portal-only** return `501 Not Implemented`
      — there is no MCP tool behind them.
    - **Portal account** (an older, retired onboarding path some existing
      dashboards still use): both **MCP** and **Portal-only** endpoints work,
      because the connection carries a full portal session, not just an
      agent-management key.

    If you're building a custom feature, assume **MCP-only** unless you know
    otherwise — it's the common case, and every built-in page in this
    dashboard is written to degrade gracefully when a Portal-only call 501s
    (see `isUnsupported()` in `src/lib/ecgClient.ts`).

    ## Authentication
    Two ways a request gets authenticated, both handled for you already:

    1. **Owner session** — you're logged into eComGear and viewing your own
       project. `ecgClient.ts` reads your Supabase session automatically.
    2. **Anonymous dashboard visitor** — someone opened the *deployed* dashboard
       URL directly, with no eComGear account. `AccessGate` (`src/pages/AccessGate.tsx`)
       exchanges an optional password for a short-lived dashboard-access token,
       stored in `localStorage` and attached to every request automatically.

    You will not normally construct either of these yourself.

    ## Status vocabulary — use the real values, don't invent your own
    Planned posts: `draft` (awaiting review) · `scheduled` · `posting` ·
    `posted` · `failed` · `cancelled`. Connectors: `connected` · `disconnected` ·
    `error`. Agents: `active` · `idle` · `suspended` · `archived`. These are
    returned unmapped from the backend — map them to display labels in the UI
    layer (see `StatusBadge.tsx`'s `statusLabel()`), never in the data layer.
  contact:
    name: eCG Agent dashboard template
    url: https://api.ecomgear.dev

servers:
  - url: "{proxyUrl}/api/v1/ecg-proxy"
    description: Your project's proxy — the values are already filled in for you in `src/ecg-config.ts` (`ECG.proxyUrl`, `ECG.projectId`).
    variables:
      proxyUrl:
        default: https://api.ecomgear.dev

security:
  - dashboardAccess: []
  - ownerSession: []

tags:
  - name: Agents
    description: The AI workers that write and (optionally) publish social content.
  - name: Schedulers
    description: Recurring posting cadences attached to an agent.
  - name: Planned Posts
    description: The content pipeline — draft, review, approve, schedule, publish.
  - name: Visual Posts
    description: AI-generated post imagery, editable on a Canva-style canvas.
  - name: Connectors
    description: Social/Zapier-MCP platform connections. One connector can cover several platforms.
  - name: Runs
    description: Execution history for agent runs.
  - name: Notifications
    description: Failed runs, rate limits, repeat-topic warnings.
  - name: Knowledge
    description: Documents and knowledge bases agents draw on for brand voice/facts.
  - name: Automation
    description: Org-wide auto-approve trust dial. Works in both connection modes.
  - name: Organization (portal-only)
    description: Org profile/billing-contact fields. Requires a full portal account connection.
  - name: Team (portal-only)
    description: Team member invite/remove. Requires a full portal account connection.
  - name: API Keys (portal-only)
    description: Portal API key management. Requires a full portal account connection.
  - name: Billing (portal-only)
    description: Invoice history. Requires a full portal account connection.
  - name: Assistant
    description: The tool-calling chat assistant and the plain LLM passthrough it does NOT use.
  - name: Templates
    description: Agent archetypes shown in the Create Agent wizard.

components:
  securitySchemes:
    dashboardAccess:
      type: apiKey
      in: header
      name: x-dashboard-access
      description: Issued by `POST /api/v1/ecg-access`; used automatically by `ecgClient.ts` for anonymous dashboard visitors.
    ownerSession:
      type: http
      scheme: bearer
      description: Supabase session JWT for the eComGear account that owns this project; attached automatically when you're logged in.

  parameters:
    projectId:
      name: projectId
      in: query
      required: true
      schema: { type: string }
      description: Filled in automatically from `ECG.projectId` — you never set this by hand.

  schemas:
    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [active, idle, suspended, archived] }
        templateName: { type: string }
        lastRun: { type: string, format: date-time, nullable: true }
        connectorIds: { type: array, items: { type: string } }
        knowledgeBaseIds: { type: array, items: { type: string } }
        timezone: { type: string, description: "IANA zone, e.g. America/New_York" }
        harness:
          $ref: '#/components/schemas/AgentHarness'
    AgentHarness:
      type: object
      description: What this agent remembers about its own past posts when writing new ones.
      properties:
        historyWindow: { type: integer, minimum: 0, maximum: 30, description: "How many of the agent's own recent posts to remember" }
        avoidRepeats: { type: boolean }
        topicsToAvoid: { type: array, items: { type: string } }
        focusTopics: { type: array, items: { type: string } }
    Scheduler:
      type: object
      properties:
        id: { type: string }
        agentId: { type: string }
        agentName: { type: string }
        cron: { type: string, description: "Standard 5-field cron. Humanize before display — see cadenceLabel() in ui.tsx; never show this raw." }
        connector: { type: string, description: "The connector's type string this scheduler posts through." }
        platforms:
          type: array
          items: { type: string }
          description: >-
            REQUIRED in practice even though the tool schema marks it optional:
            omitting it defaults server-side to ['linkedin'], which silently
            mis-targets any connector that doesn't cover LinkedIn. Always pass
            the connector's actual platforms.
        postCount: { type: integer, minimum: 1, maximum: 10 }
        status: { type: string, enum: [active, paused] }
        nextRun: { type: string, format: date-time, nullable: true }
    PlannedPost:
      type: object
      properties:
        id: { type: string }
        content: { type: string }
        platform: { type: string }
        status: { type: string, enum: [draft, scheduled, posting, posted, failed, cancelled] }
        agentName: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1, description: "Agent's own confidence in this post, shown only while status=draft." }
        scheduledAt: { type: string, format: date-time, nullable: true }
        postUrl: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true, description: "Present only when status=failed." }
    Connector:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, description: "'zapier' (generic, multi-platform) or 'zapier-mcp-<platform>' (legacy, single-platform), or 'whatsapp'." }
        status: { type: string, enum: [connected, disconnected, error] }
        platforms:
          type: array
          items: { type: string }
          description: >-
            The authoritative list of platforms this connector covers. Always
            read this, not `type` — a generic 'zapier' connector can cover
            several platforms at once. See platformsForConnector() in PostsPage.tsx.
    VisualPost:
      type: object
      properties:
        id: { type: string }
        plannedPostId: { type: string, nullable: true }
        width: { type: integer }
        height: { type: integer }
        background: { type: string }
        objects:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: "Internal key (e.g. text-1706293823123) — never shown to users as a label." }
              type: { type: string, enum: [text, image, shape] }
              x: { type: number }
              y: { type: number }
              width: { type: number }
              height: { type: number }
    KnowledgeEntry:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        status: { type: string, enum: [processing, ready, error] }
    KnowledgeBase:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        assetCount: { type: integer }
    Run:
      type: object
      properties:
        id: { type: string }
        agentId: { type: string }
        status: { type: string, enum: [success, error, timeout] }
        durationMs: { type: integer }
        cost: { type: number }
        startedAt: { type: string, format: date-time }
        errorMessage: { type: string, nullable: true }
    Error:
      type: object
      properties:
        error: { type: string }

  responses:
    Unsupported:
      description: >-
        No MCP tool exists for this operation on an MCP-key-connected
        dashboard. Check with `isUnsupported(e)` (`ecgClient.ts`) rather than
        treating this as a generic failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /agent-templates:
    get:
      tags: [Templates]
      summary: List agent templates for the Create Agent wizard
      x-mcp-support: MCP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    description: { type: string }
                    connectorTypes: { type: array, items: { type: string } }
                    scheduleCapable: { type: boolean }
                    instructionsHint: { type: string }

  /agents:
    get:
      tags: [Agents]
      summary: List agents
      x-mcp-support: MCP
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Agent' } } } } }
    post:
      tags: [Agents]
      summary: Create an agent
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, templateId]
              properties:
                name: { type: string }
                templateId: { type: string }
                promptOverlay: { type: string, description: "Shown to the user as plain 'Instructions' — a free-text steer layered onto the template's own system prompt." }
                connectorIds: { type: array, items: { type: string } }
                timezone: { type: string }
                knowledgeBaseIds: { type: array, items: { type: string } }
      responses:
        '200': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }

  /agents/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Agents]
      summary: Get agent status, recent runs, and schedulers
      x-mcp-support: MCP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: '#/components/schemas/Agent' }
                  recentRuns: { type: array, items: { $ref: '#/components/schemas/Run' } }
                  schedulers: { type: array, items: { $ref: '#/components/schemas/Scheduler' } }
    patch:
      tags: [Agents]
      summary: Update an agent (name, instructions, connectors, status, timezone, knowledge, memory)
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                promptOverlay: { type: string }
                connectorIds: { type: array, items: { type: string } }
                status: { type: string, enum: [active, idle, suspended, archived] }
                timezone: { type: string }
                knowledgeBaseIds: { type: array, items: { type: string } }
                harness: { $ref: '#/components/schemas/AgentHarness' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }
    delete:
      tags: [Agents]
      summary: Delete an agent
      description: >-
        Requires `status: archived` first — the API returns an error whose
        message matches `/only archived agents can be deleted/i` if it isn't.
        Archive it (`PATCH` with `status: 'archived'`), then retry the delete.
      x-mcp-support: MCP
      responses:
        '200': { description: Deleted }
        '400':
          description: Not archived yet
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /agents/{id}/run:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Agents]
      summary: Run an agent immediately, outside its normal schedule
      x-mcp-support: MCP
      responses:
        '200': { description: Run started }

  /schedulers:
    get:
      tags: [Schedulers]
      summary: List schedulers
      x-mcp-support: MCP
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Scheduler' } } } } }
    post:
      tags: [Schedulers]
      summary: Create a scheduler
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [agentId, cron, connector]
              properties:
                agentId: { type: string }
                cron: { type: string, description: "Build with buildWeeklyCron(days, hour) from ui.tsx — don't hand-write cron strings." }
                connector: { type: string, description: "The connector's type string (e.g. 'zapier' or 'zapier-mcp-linkedin')." }
                platforms:
                  type: array
                  items: { type: string }
                  description: "Always pass this — see the warning on the Scheduler schema."
                postCount: { type: integer, default: 3 }
      responses:
        '200': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Scheduler' } } } }

  /schedulers/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [Schedulers]
      summary: Pause or resume a scheduler
      description: "The only PATCH this dashboard sends is a status toggle: `status` set to `paused` or `active`."
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { status: { type: string, enum: [paused, active] } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Schedulers]
      summary: Delete a scheduler
      x-mcp-support: MCP
      responses:
        '200': { description: Deleted }

  /schedulers/{id}/replan:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Schedulers]
      summary: Trigger a scheduler now
      description: "Called by `ecgApi.schedulers.trigger(id)` — the client method name says 'trigger', the real route is `/replan`. There is no separate `/trigger` endpoint."
      x-mcp-support: MCP
      responses:
        '200': { description: Triggered }

  /planned-posts:
    get:
      tags: [Planned Posts]
      summary: List planned posts
      x-mcp-support: MCP
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PlannedPost' } } } } }
    post:
      tags: [Planned Posts]
      summary: Create a post directly (not agent-generated)
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [content, platform]
              properties:
                content: { type: string }
                platform: { type: string }
      responses:
        '200': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PlannedPost' } } } }

  /planned-posts/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [Planned Posts]
      summary: Approve, reject, or edit a post
      description: >-
        Same endpoint, three different bodies. `{status: 'scheduled'}` approves
        a draft OR retries a failed post (both are literally the same call).
        `{status: 'cancelled'}` rejects/cancels. Omitting `status` and sending
        `content`/`platform`/`scheduledAt` edits the post in place.
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties: { status: { type: string, enum: [scheduled, cancelled] } }
                - type: object
                  properties:
                    content: { type: string }
                    platform: { type: string }
                    scheduledAt: { type: string, format: date-time }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/PlannedPost' } } } }
    delete:
      tags: [Planned Posts]
      summary: Permanently delete a post
      description: "Distinct from rejecting/cancelling — this removes the record entirely, cancel just stops it from publishing."
      x-mcp-support: MCP
      responses:
        '200': { description: Deleted }

  /planned-posts/bulk-approve:
    post:
      tags: [Planned Posts]
      summary: Approve multiple drafts at once
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [postIds]
              properties: { postIds: { type: array, items: { type: string } } }
      responses:
        '200': { description: Approved }

  /planned-posts/{id}/regenerate:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Planned Posts]
      summary: Rewrite a post's content with AI, optionally steered by feedback
      description: "Distinct from approve/reject — this changes content and puts the post back to `draft` for review. Does not touch status directly."
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { feedback: { type: string, description: "e.g. 'make it shorter, less salesy'. Optional — omit for a fresh take on the same topic." } }
      responses:
        '200': { description: Regenerated, content: { application/json: { schema: { $ref: '#/components/schemas/PlannedPost' } } } }

  /visual-posts:
    get:
      tags: [Visual Posts]
      summary: List visual posts, optionally filtered by planned post
      x-mcp-support: MCP
      parameters:
        - name: plannedPostId
          in: query
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VisualPost' } } } } }

  /visual-posts/generate:
    post:
      tags: [Visual Posts]
      summary: Generate a new visual post with AI
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [postContent]
              properties:
                postContent: { type: string }
                agentId: { type: string }
                plannedPostId: { type: string }
                platform: { type: string }
                stylePrompt: { type: string }
      responses:
        '200': { description: Generated, content: { application/json: { schema: { $ref: '#/components/schemas/VisualPost' } } } }

  /visual-posts/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Visual Posts]
      summary: Get a visual post
      x-mcp-support: MCP
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VisualPost' } } } }
    patch:
      tags: [Visual Posts]
      summary: Update canvas objects/background
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                objects: { type: array, items: { type: object } }
                background: { type: string }
      responses:
        '200': { description: Updated }
    delete:
      tags: [Visual Posts]
      summary: Delete a visual post
      x-mcp-support: MCP
      responses:
        '200': { description: Deleted }

  /visual-posts/{id}/regenerate:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Visual Posts]
      summary: Regenerate a visual post's imagery
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [postContent]
              properties: { postContent: { type: string }, stylePrompt: { type: string } }
      responses:
        '200': { description: Regenerated }

  /visual-posts/{id}/finalize:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Visual Posts]
      summary: Lock in a visual post for publishing
      x-mcp-support: MCP
      responses:
        '200': { description: Finalized }

  /connectors/org:
    get:
      tags: [Connectors]
      summary: List connectors
      x-mcp-support: MCP
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Connector' } } } } }
    post:
      tags: [Connectors]
      summary: Create a connector
      description: >-
        Use 'zapier' as `type` for a generic, multi-platform Zapier MCP
        connector and pass `platforms` explicitly (recommended — one token
        commonly covers several platforms at once). Narrow types like
        'zapier-mcp-linkedin' still work for a single platform without
        needing `platforms`. 'whatsapp' is the one native (non-Zapier) type.
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type, name]
              properties:
                type: { type: string }
                name: { type: string }
                apiKey: { type: string, description: "Zapier MCP token, when type is 'zapier' or 'zapier-mcp-*'." }
                webhookUrl: { type: string }
                phone: { type: string, description: "Required when type is 'whatsapp'." }
                platforms: { type: array, items: { type: string } }
      responses:
        '200': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Connector' } } } }

  /connectors/org/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [Connectors]
      summary: Update a connector
      x-mcp-support: MCP
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Connector' } } } }
    delete:
      tags: [Connectors]
      summary: Delete a connector
      x-mcp-support: MCP
      responses:
        '200': { description: Deleted }

  /connectors/org/{id}/test:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Connectors]
      summary: Verify a connector actually works
      x-mcp-support: MCP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { note: { type: string } } }

  /connectors/discover:
    post:
      tags: [Connectors]
      summary: Check which platforms a Zapier MCP token actually has enabled
      description: >-
        Call this BEFORE creating a connector with a pasted token — tells you
        exactly which platforms (e.g. ["LinkedIn", "Instagram"]) it can
        publish to, instead of guessing among the type dropdown options.
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { apps: { type: array, items: { type: string } } } }

  /runs:
    get:
      tags: [Runs]
      summary: List run history
      x-mcp-support: MCP
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Run' } } } } }

  /stats:
    get:
      tags: [Runs]
      summary: Dashboard-wide stats (platform breakdown, daily activity, status pipeline, run success)
      x-mcp-support: MCP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  platforms:
                    type: array
                    items:
                      type: object
                      properties: { platform: { type: string }, posted30d: { type: integer }, previous30d: { type: integer }, total: { type: integer } }
                  daily:
                    type: array
                    items:
                      type: object
                      properties: { platform: { type: string }, day: { type: string }, count: { type: integer } }
                  statusBreakdown: { type: object, additionalProperties: { type: integer } }
                  runs30d: { type: object, properties: { success: { type: integer }, failed: { type: integer }, cost: { type: number } } }

  /notifications:
    get:
      tags: [Notifications]
