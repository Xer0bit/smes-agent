  /knowledge:
    get:
      tags: [Knowledge]
      summary: List knowledge entries
      description: >-
        The response has no `kbId` field, so entries here can't be grouped by
        which Knowledge Base they belong to in the UI today — a known backend
        limitation, not a client bug.
      x-mcp-support: MCP
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Free-text search.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/KnowledgeEntry' } } } } }
    post:
      tags: [Knowledge]
      summary: Add a knowledge entry (text)
      x-mcp-support: MCP
      responses:
        '200': { description: Created }

  /knowledge/upload:
    post:
      tags: [Knowledge]
      summary: Upload a knowledge document
      x-mcp-support: MCP
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary } } }
      responses:
        '200': { description: Uploaded }

  /knowledge/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      tags: [Knowledge]
      summary: Delete a knowledge entry
      x-mcp-support: MCP
      responses:
        '200': { description: Deleted }

  /knowledge-bases:
    get:
      tags: [Knowledge]
      summary: List knowledge bases
      x-mcp-support: MCP
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/KnowledgeBase' } } } } }
    post:
      tags: [Knowledge]
      summary: Create a knowledge base
      x-mcp-support: MCP
      requestBody:
        content:
