  /summary:
    get:
      tags: [Billing (portal-only)]
      summary: Portal-account summary
      x-mcp-support: Portal-only
      responses:
        '200': { description: OK }
        '501': { $ref: '#/components/responses/Unsupported' }

  /ai-chat:
    post:
      tags: [Assistant]
      summary: Plain LLM passthrough (NOT what the built-in Assistant uses)
      description: >-
        A tool-less, direct call to whichever LLM provider this org has
        configured. The dashboard's own "Assistant" tab does NOT call this —
        it calls `POST /api/v1/ecg-chat` (a different, sibling endpoint, not
        under this proxy) via the top-level `chat()` function in
        `ecgClient.ts`, which can actually invoke tools (list/create/run
        agents, approve posts, etc.). Reach for this endpoint only if you
        want a raw completion with zero tool access; extend `ChatPage.tsx` /
        `ecg-chat.routes.ts` instead of duplicating agentic chat logic here.
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties: { role: { type: string, enum: [user, assistant, system] }, content: { type: string } }
      responses:
        '200': { description: OK }
