      x-mcp-support: MCP
      responses:
        '200': { description: Updated }
    delete:
      tags: [Knowledge]
      summary: Delete a knowledge base
      x-mcp-support: MCP
      responses:
        '200': { description: Deleted }

  /org-settings:
    get:
      tags: [Automation]
      summary: Get the auto-approve trust dial
      x-mcp-support: MCP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { autoApprovePosts: { type: boolean }, autoApproveConfidenceThreshold: { type: number, minimum: 0, maximum: 1 } }
    patch:
      tags: [Automation]
      summary: Update the auto-approve trust dial
      description: When enabled, an agent can publish on its own once confident enough, skipping manual review — applies org-wide.
      x-mcp-support: MCP
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { autoApprovePosts: { type: boolean }, autoApproveConfidenceThreshold: { type: number } }
      responses:
        '200': { description: Updated }

