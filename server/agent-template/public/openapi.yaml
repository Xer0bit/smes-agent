      x-mcp-support: Portal-only
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        '200':
          description: >-
            Created. The full key value is only ever returned in this
            response — store it now, it can't be retrieved again.
        '501': { $ref: '#/components/responses/Unsupported' }

