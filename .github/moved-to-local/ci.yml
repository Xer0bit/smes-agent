name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for diffing against the base branch below

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Root — install, typecheck (advisory), test (blocking)
        run: |
          npm ci --legacy-peer-deps
          # tsc -p tsconfig.app.json was never actually invokable before this
          # workflow (an invalid ignoreDeprecations value in tsconfig.app.json
          # made it hard-fail immediately) — now that it runs, it surfaces
          # ~16 pre-existing type errors scattered across unrelated files.
          # Report only until those are cleaned up; don't block unrelated PRs.
          npx tsc --noEmit -p tsconfig.app.json || echo "::warning::root typecheck has pre-existing errors (non-blocking)"
          # server/** is a separate package with its own node_modules — it
          # gets its own vitest run in the Server step below.
          npx vitest run --exclude 'server/**'

      - name: Root — lint changed files (blocking)
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.ts' '*.tsx' | grep -v '^server/' || true)
          if [ -n "$CHANGED" ]; then
            echo "Linting changed root files:"
            echo "$CHANGED"
            npx eslint --max-warnings=0 $CHANGED
          else
            echo "No changed root .ts/.tsx files to lint."
          fi

      - name: Root — lint full repo (advisory)
        run: npm run lint || echo "::warning::root lint has pre-existing errors (non-blocking)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Server — install, typecheck (blocking), test (blocking)
        run: |
          cd server
          npm ci
          npx tsc --noEmit
          npx vitest run src/services

      - name: Server — lint changed files (blocking)
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- 'server/**/*.ts' | sed 's#^server/##' || true)
          if [ -n "$CHANGED" ]; then
            echo "Linting changed server files:"
            echo "$CHANGED"
            (cd server && npx eslint --max-warnings=0 $CHANGED)
          else
            echo "No changed server .ts files to lint."
          fi

      - name: Server — lint full repo (advisory)
        run: cd server && npm run lint || echo "::warning::server lint has pre-existing errors (non-blocking)"

      - name: Detect if preview-service changed
        id: pv
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'preview-service/**')
          [ -n "$CHANGED" ] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Preview-service preflight
        if: steps.pv.outputs.run == 'true'
        run: |
          cd preview-service && npm ci --omit=dev && cd ..
          bash scripts/preview-preflight.sh
